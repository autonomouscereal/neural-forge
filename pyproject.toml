[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-forge"
version = "0.1.0"
description = "Shape-surgery tools for shrinking, expanding, and merging dense neural checkpoints."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
]
authors = [
  { name = "autonomouscereal" }
]
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
neural-forge = "neural_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

